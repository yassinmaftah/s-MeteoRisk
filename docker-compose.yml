version: '3.8'

services:
  pipeline:
    build: .
    volumes:
      - .:/app
    depends_on:
      - db
  db:
    image: postgres:16
    container_name: meteorisk_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ysn.mfth
      POSTGRES_DB: s_meteorisk_db
    ports:
      - "5432:5432"
    volumes:
    - pg_data:/var/lib/postgresql/data  
volumes:
  pg_data: